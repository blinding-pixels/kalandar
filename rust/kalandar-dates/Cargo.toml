[package]
name = "kalandar-dates"
version = "0.2.0"
edition = "2021"
license = "MIT AND CC-BY-SA-3.0"
description = "Date, time, repeat, lead-time and holiday resolution for Kalandar, built on a Rust port of chrono-node v2.10.1."
readme = "README.md"
repository = "https://github.com/blinding-pixels/kalandar"
homepage = "https://github.com/blinding-pixels/kalandar"
keywords = ["date", "parser", "natural-language", "recurrence", "holidays"]
categories = ["date-and-time", "parser-implementations"]
include = ["Cargo.toml", "README.md", "LICENSE", "LICENSES/**", "docs/**", "src/**"]

[features]
default = ["tz", "capture", "json"]
tz = ["dep:chrono-tz"]
capture = ["tz", "dep:serde", "chrono/serde"]
json = ["capture", "dep:serde_json"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", optional = true }
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "diff_runner"
required-features = ["tz"]

[[example]]
name = "capture_eval"
required-features = ["capture"]

[[example]]
name = "capture_debug"
required-features = ["capture"]

[[example]]
name = "rows_eval"
required-features = ["capture"]

[[example]]
name = "holiday_probe"
required-features = ["capture"]

[[example]]
name = "schedule_probe"
required-features = ["json"]
