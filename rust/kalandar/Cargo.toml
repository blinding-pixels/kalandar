[package]
name = "kalandar"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Native Rust capture-preview parser runtime for Kalandar."
readme = "README.md"
repository = "https://github.com/blinding-pixels/kalandar"
homepage = "https://github.com/blinding-pixels/kalandar"
keywords = ["calendar", "tasks", "reminders", "nlp"]
categories = ["date-and-time", "parser-implementations"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[lib]
path = "src/lib.rs"

[features]
default = ["ort-download"]
ort-download = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-native"]

[dependencies]
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
