[package]
name = "kalandar-dates-ffi"
version = "0.2.1"
edition = "2021"
license = "MIT AND CC-BY-SA-3.0"
description = "UniFFI bindings that let Swift call kalandar-dates and the kalandar capture rules."
repository = "https://github.com/blinding-pixels/kalandar"
publish = false

[lib]
crate-type = ["staticlib", "lib"]
name = "kalandar_dates_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
kalandar = { path = "../kalandar", version = "0.2.1", default-features = false }
kalandar-dates = { path = "../kalandar-dates", version = "0.2.1", features = ["json"] }
uniffi = "0.29"
serde_json = "1"
