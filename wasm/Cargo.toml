[package]
name = "chrono-english-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm-bindgen build of chrono-english-rs and its Facets layer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
chrono-english-rs = { path = "..", features = ["facets"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.121"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
