name: Close pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    name: Close pull request
    runs-on: ubuntu-latest
    steps:
      - name: Close with project policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CLOSE_COMMENT: "Plese report your submission as an issue and I'll take a look. If you need something added urgently please feel free to fork the repo."
        run: gh pr close "$PR_URL" --comment "$CLOSE_COMMENT"
